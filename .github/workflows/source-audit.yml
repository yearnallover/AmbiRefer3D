name: source-audit
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy
      - run: PYTHONDONTWRITEBYTECODE=1 python tools/audit_release.py
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p test_release_contracts.py

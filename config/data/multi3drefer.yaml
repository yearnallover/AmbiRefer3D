defaults:
- scannetv2
lang_dataset: Multi3DRefer
lang_dataset_path: ${data.data_root_path}/multi3drefer
lang_metadata:
  metadata_root_path: ${project_root_path}/dataset/ambirefer3d_annotations/real/stage1
  metadata_variant: minimal
  metadata_variant_dir: ${data.lang_metadata.metadata_variant}_json
  metadata_file_prefix: ambi_${data.lang_metadata.metadata_variant}
  train_language_data: ${oc.env:MULTI3DREFER_TRAIN_JSON,${data.lang_metadata.metadata_root_path}/train_mt.json}
  val_language_data: ${oc.env:MULTI3DREFER_VAL_JSON,${data.lang_metadata.metadata_root_path}/val_minimal_mt.json}
  test_language_data: ${oc.env:MULTI3DREFER_TEST_JSON,${data.lang_metadata.metadata_root_path}/val_minimal_mt.json}
positive_object_key: object_ids
chunk_size: 8
evaluator:
  _target_: m3drefclip.evaluation.multi3drefer_evaluator.Multi3DReferEvaluator
  verbose: false
  metric_name: f1
monitor_value: f1@0.5_overall

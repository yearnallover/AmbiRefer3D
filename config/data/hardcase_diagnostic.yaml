# Model-ready interactive scene-edit hard-case diagnostic benchmark.

defaults:
  - scannetv2

lang_dataset: Multi3DRefer
lang_dataset_path: ${project_root_path}/dataset/hardcase_diagnostic_v2
scene_dataset_path: ${data.lang_dataset_path}

lang_metadata:
  metadata_root_path: ${data.lang_dataset_path}/metadata
  metadata_variant: hardcase_edit
  metadata_variant_dir: metadata
  metadata_file_prefix: hardcase
  train_language_data: ${data.lang_metadata.metadata_root_path}/test_language.json
  val_language_data: ${data.lang_metadata.metadata_root_path}/test_language.json
  test_language_data: ${data.lang_metadata.metadata_root_path}/test_language.json

positive_object_key: object_ids
chunk_size: 1

dataloader:
  batch_size: 1
  num_workers: 0

inference:
  split: test

evaluation:
  split: test

online_trajectory:
  enabled: True
  path: ${data.lang_metadata.metadata_root_path}/trajectories.json
  ambiguity_type: ""
  max_rounds: 4
  strict_query_alignment: True
  repair_target_set: False
  require_train_match: False

evaluator:
  _target_: m3drefclip.evaluation.multi3drefer_evaluator.Multi3DReferEvaluator
  verbose: False
  metric_name: f1

monitor_value: f1@0.5_overall

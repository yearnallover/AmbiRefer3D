# Managed by Hydra

hydra:
  output_subdir: null
  run:
    dir: .

defaults:
  - _self_
  - model: m3dref_clip
  - data: base
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

project_root_path: ${oc.env:AMBIREFER3D_PROJECT_ROOT,${hydra:runtime.cwd}}
experiment_output_path: ${project_root_path}/output/${data.lang_dataset}/${experiment_name}
pred_path: ${experiment_output_path}/inference

ckpt_path: null
init_from_ckpt: null
init_from_ckpt_strict: False
experiment_name: null
train_seed: 123
test_seed: 123
# Optional control for experiments whose model variants instantiate different
# modules but must consume the same DataLoader order.
reset_seed_after_model_init: False

# Fail-closed machine evidence for the formal targeted-finetuning path. The
# preflight emits the required overrides; ordinary experiments keep it off.
formal_training_runtime:
  enabled: False
  track: query_conditioned_grounding
  model: null
  training_bundle_manifest: null
  trainer_preflight: null
  recovery_plan_manifest: null
  recovery_data_audit_manifest: null
  recovery_training_bundle_manifest: null
  recovery_trainer_preflight: null
  output_report: ${experiment_output_path}/training/gpu_training_runtime.json

logger:
  # https://pytorch-lightning.readthedocs.io/en/stable/extensions/generated/pytorch_lightning.loggers.WandbLogger.html
  _target_: lightning.pytorch.loggers.WandbLogger
  project: AmbiRefer3D
  name: ${experiment_name}
  save_dir: ${experiment_output_path}/training
  offline: True

  # https://pytorch-lightning.readthedocs.io/en/stable/api/pytorch_lightning.loggers.tensorboard.html
  #  _target_: lightning.pytorch.loggers.TensorBoardLogger
  #  project: AmbiRefer3D
  #  name: ${experiment_name}

# https://pytorch-lightning.readthedocs.io/en/stable/common/trainer.html
trainer:
  accelerator: gpu
  max_epochs: 60
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 2
  profiler: simple
  precision: 32
  reload_dataloaders_every_n_epochs: 1  # for shuffling language data chunks

# https://pytorch-lightning.readthedocs.io/en/stable/api/pytorch_lightning.callbacks.ModelCheckpoint.html
checkpoint_monitor:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  monitor: val_eval/${data.monitor_value}
  mode: max
  save_last: True
  save_top_k: 3
  every_n_epochs: ${trainer.check_val_every_n_epoch}
  filename: "{epoch}"
  dirpath: ${experiment_output_path}/training

model_name:
  _target_: m3drefclip.model.m3dref_clip.M3DRefCLIP
stage1_backbone:
  name: m3drefclip
  checkpoint: null
  span_checkpoint: null
  detector_root: null
  bert_root: null
  roberta_root: null
  scene_root: ${project_root_path}/dataset/scannetv2
  freeze_point_backbone: false
  freeze_native_backbone: false
  freeze_point_features: true
  freeze_sparse_backbone: false
  voxel_size: 0.01
  nms_iou_threshold: 0.5
  cache_scenes: 8
network:
  max_num_proposals: 80
  use_contrastive_loss: true
  clip_model: ViT-B/32
  use_2d_feature: true
  use_3d_features: true
  detector:
    output_channel: 32
    use_gt_proposal: false
  object_renderer:
    eye:
    - - 0.86
      - 0.5
      - 1
    - - -0.86
      - 0.5
      - 1
    - - 0
      - -1
      - 1
    rasterizer_setting:
      image_size: 224
      radius: 0.025
      points_per_pixel: 3
      bin_size: 0
  clip_word_encoder:
    _target_: m3drefclip.model.language_module.clip_word_encoder.CLIPWordEncoder
    output_channel: 128
    dropout: 0.1
  clip_img_encoder:
    output_channel: 128
    dropout: 0.1
  matching_module:
    feat_channel: 128
    head: 4
    depth: 2
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0005
  weight_decay: 1.0e-05
lr_decay:
  start_epoch: 30
inference:
  output_threshold: 0.01
  export_multi3drefer_style: false
loss:
  reference_bce_loss:
    _target_: m3drefclip.loss.reference_loss.RefBCELoss
    iou_threshold: 0.5
    matching_strategy: hungarian
  reference_ce_loss:
    _target_: m3drefclip.loss.reference_loss.RefCELoss
    iou_threshold: 0
  contrastive_loss:
    _target_: m3drefclip.loss.contrastive_loss.SinglePairContrastiveLoss
    temperature: 2.6593
    split_batch: false
